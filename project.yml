name: Rota
options:
  bundleIdPrefix: com.rota
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.46.0"

targets:
  Rota:
    type: application
    platform: iOS
    sources:
      - path: Rota
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rota.app
        INFOPLIST_FILE: Rota/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    # To enable real Supabase + signing, copy Secrets.example.xcconfig to Secrets.xcconfig
    configFiles:
      Debug: Rota/Config/Secrets.example.xcconfig
      Release: Rota/Config/Secrets.example.xcconfig

  RotaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RotaTests
    dependencies:
      - target: Rota
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rota.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rota:
    build:
      targets:
        Rota: all
        RotaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RotaTests
