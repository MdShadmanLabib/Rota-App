name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Provide debug secrets config
        run: cp Rota/Config/Secrets.example.xcconfig Rota/Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Rota.xcodeproj -scheme Rota

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project Rota.xcodeproj \
            -scheme Rota \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify --renderer github-actions
